<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

  <title>DEEPBYTO Recognizer</title>

  <!-- favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <meta
    name="description"
    content="DEEPBYTO Recognizer - real-time English speech to text in your browser."
  >

  <style>
    /* ----- reset & base ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;          /* dynamic viewport height for mobile */
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;     /* allow content to grow, but we control height */
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    /* main container: full viewport, no scroll on desktop */
    .app {
      width: 100%;
      max-width: 880px;            /* comfortable reading width */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: #080808;
      /* no extra margins */
    }

    /* ----- header / logo (compact) ----- */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0 8px 0;
      border-bottom: 1px solid #1f1f1f;
      flex-shrink: 0;
    }

    .logo-container {
      flex-shrink: 0;
      line-height: 0;
    }

    .logo-container img {
      display: block;
      width: 48px;                /* sharp and clean */
      height: 48px;
      object-fit: contain;
      background: transparent;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 400;
      color: #888888;
      letter-spacing: 1px;
      margin-top: 1px;
    }

    /* ----- main card ----- */
    .card {
      flex: 1 1 auto;
      background: #111111;
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 18px 22px 18px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;              /* flex override */
      /* ensure card uses available space */
    }

    /* heading and description – compact */
    .card-header {
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .card-header h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin: 0;
      color: #ffffff;
    }

    .card-header .description {
      color: #999999;
      font-size: 13px;
      margin-top: 2px;
      margin-bottom: 6px;
    }

    /* status */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #aaaaaa;
      font-size: 12px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555555;
      transition: background 0.1s;
    }

    .status.recording .status-dot {
      background: #ffffff;
      box-shadow: 0 0 12px #ffffff;
    }

    /* textarea – grows to fill available space */
    .textarea-wrapper {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 120px;          /* fallback */
    }

    textarea {
      width: 100%;
      flex: 1 1 auto;
      resize: none;              /* prevent manual resize to keep layout stable */
      background: #080808;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100px;
      transition: border-color 0.1s;
    }

    textarea:focus {
      border-color: #555555;
    }

    textarea::placeholder {
      color: #555555;
    }

    /* stats row */
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: #666666;
      font-size: 11px;
      flex-shrink: 0;
    }

    /* controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      flex-shrink: 0;
    }

    button {
      border: 1px solid #333333;
      background: #191919;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;           /* touch friendly */
    }

    button:hover {
      background: #252525;
    }

    .start {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .start:hover {
      background: #dddddd;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mic-button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 20px;
      padding: 0;
      line-height: 1;
    }

    .mic-button.recording {
      border-color: #ffffff;
    }

    /* error & info */
    .error {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #444444;
      border-radius: 10px;
      color: #cccccc;
      font-size: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .info {
      margin-top: 10px;
      padding: 8px 10px;
      background: #0c0c0c;
      border: 1px solid #222222;
      border-radius: 10px;
      color: #777777;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      flex-shrink: 0;
    }

    /* footer */
    footer {
      text-align: center;
      color: #555555;
      font-size: 11px;
      padding: 8px 0 2px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }

    /* ----- responsive adjustments ----- */
    @media (max-width: 700px) {
      .app {
        padding: 8px 10px 6px;
      }

      .card {
        padding: 14px 14px 14px;
        border-radius: 18px;
        margin-top: 10px;
      }

      .card-header h1 {
        font-size: 21px;
      }

      .brand-name {
        font-size: 16px;
      }

      .logo-container img {
        width: 40px;
        height: 40px;
      }

      textarea {
        font-size: 15px;
        padding: 12px 14px;
        min-height: 80px;
      }

      .controls {
        gap: 6px;
      }

      button {
        padding: 8px 12px;
        font-size: 12px;
        min-height: 40px;
      }

      .mic-button {
        width: 46px;
        height: 46px;
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 6px 6px 4px;
      }

      .card {
        padding: 12px 10px 12px;
        border-radius: 16px;
        margin-top: 8px;
      }

      .brand {
        gap: 8px;
        padding: 4px 0 6px;
      }

      .logo-container img {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-sub {
        font-size: 10px;
      }

      .card-header h1 {
        font-size: 18px;
      }

      .card-header .description {
        font-size: 12px;
        margin-top: 0;
      }

      .status {
        font-size: 11px;
        margin-bottom: 6px;
      }

      textarea {
        font-size: 14px;
        padding: 10px 12px;
        min-height: 70px;
      }

      .controls {
        gap: 4px;
        margin-top: 8px;
      }

      button {
        padding: 6px 10px;
        font-size: 11px;
        min-height: 36px;
        border-radius: 8px;
      }

      .mic-button {
        width: 42px;
        height: 42px;
        font-size: 16px;
      }

      .stats {
        font-size: 10px;
      }

      .info {
        font-size: 10px;
        padding: 6px 8px;
        margin-top: 6px;
      }

      footer {
        font-size: 10px;
        padding: 6px 0 2px;
      }
    }

    /* for very tall screens, keep proportions */
    @media (min-height: 900px) {
      .card {
        padding: 22px 28px 22px;
      }
      textarea {
        min-height: 160px;
      }
    }

    /* small height (e.g. netbooks) */
    @media (max-height: 700px) {
      .brand {
        padding: 2px 0 4px;
      }
      .logo-container img {
        width: 36px;
        height: 36px;
      }
      .brand-name {
        font-size: 15px;
      }
      .card-header h1 {
        font-size: 20px;
      }
      .card {
        padding: 10px 14px 10px;
        margin-top: 6px;
      }
      textarea {
        min-height: 60px;
        font-size: 14px;
        padding: 8px 12px;
      }
      .controls {
        margin-top: 6px;
        gap: 4px;
      }
      button {
        padding: 6px 10px;
        font-size: 11px;
        min-height: 32px;
      }
      .mic-button {
        width: 38px;
        height: 38px;
        font-size: 15px;
      }
      .info {
        padding: 4px 8px;
        margin-top: 4px;
        font-size: 10px;
      }
      footer {
        padding: 2px 0;
        font-size: 10px;
      }
    }

    /* remove extra scroll on mobile */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- header with actual DEEPBYTO logo -->
    <header class="brand">
      <div class="logo-container">
        <img src="logo.png" alt="DEEPBYTO Logo" width="48" height="48">
      </div>
      <div class="brand-text">
        <span class="brand-name">DEEPBYTO Recognizer</span>
        <span class="brand-sub">Speech Recognition</span>
      </div>
    </header>

    <!-- main card -->
    <div class="card">

      <div class="card-header">
        <h1>Speak. Transcribe. Done.</h1>
        <p class="description">
          Convert your English speech into text in real time.
        </p>
      </div>

      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>

      <!-- textarea wrapper: flex grow -->
      <div class="textarea-wrapper">
        <textarea
          id="transcript"
          placeholder="Your speech will appear here..."
          spellcheck="false"
        ></textarea>
      </div>

      <div class="stats">
        <span>English — en-US</span>
        <span id="counter">0 characters</span>
      </div>

      <div class="controls">

        <button
          class="mic-button"
          id="micButton"
          title="Start microphone"
          aria-label="Start microphone"
        >
          🎙
        </button>

        <button
          class="start"
          id="startButton"
        >
          Start
        </button>

        <button
          id="stopButton"
          disabled
        >
          Stop
        </button>

        <button
          id="copyButton"
        >
          Copy
        </button>

        <button
          id="clearButton"
        >
          Clear
        </button>

      </div>

      <div class="error" id="error"></div>

      <div class="info">
        For best results, use the latest Chrome or Edge over HTTPS.
        Microphone permission is required.
      </div>

    </div>

    <footer>
      DEEPBYTO · AI &amp; Software Innovations Lab
    </footer>

  </div>

  <script>
    (function() {
      'use strict';

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const transcriptBox = document.getElementById("transcript");
      const startButton = document.getElementById("startButton");
      const stopButton = document.getElementById("stopButton");
      const micButton = document.getElementById("micButton");
      const copyButton = document.getElementById("copyButton");
      const clearButton = document.getElementById("clearButton");
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const errorBox = document.getElementById("error");
      const counter = document.getElementById("counter");

      let recognition;
      let isRecording = false;
      let finalText = "";

      function updateCounter() {
        counter.textContent = transcriptBox.value.length + " characters";
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      function hideError() {
        errorBox.style.display = "none";
      }

      function setRecordingState(recording) {
        isRecording = recording;

        if (recording) {
          status.classList.add("recording");
          statusText.textContent = "Listening...";
          startButton.disabled = true;
          stopButton.disabled = false;
          micButton.classList.add("recording");
        } else {
          status.classList.remove("recording");
          statusText.textContent = "Ready";
          startButton.disabled = false;
          stopButton.disabled = true;
          micButton.classList.remove("recording");
        }
      }

      if (!SpeechRecognition) {
        startButton.disabled = true;
        micButton.disabled = true;
        showError(
          "Speech Recognition is not supported in this browser. Please use the latest Google Chrome or Microsoft Edge."
        );
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function () {
          hideError();
          setRecordingState(true);
        };

        recognition.onresult = function (event) {
          let interimText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const text = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalText += text + " ";
            } else {
              interimText += text;
            }
          }

          transcriptBox.value = finalText + interimText;
          updateCounter();
          transcriptBox.scrollTop = transcriptBox.scrollHeight;
        };

        recognition.onerror = function (event) {
          if (event.error === "not-allowed") {
            showError(
              "Microphone permission was denied. Please allow microphone access and try again."
            );
          } else if (event.error === "no-speech") {
            showError(
              "No speech detected. Please speak clearly and try again."
            );
          } else {
            showError(
              "Speech recognition error: " + event.error
            );
          }
          setRecordingState(false);
        };

        recognition.onend = function () {
          if (isRecording) {
            try {
              recognition.start();
            } catch (e) {
              // ignore
            }
          } else {
            setRecordingState(false);
          }
        };
      }

      function startRecognition() {
        if (!recognition) return;
        hideError();
        try {
          recognition.start();
        } catch (e) {
          // ignore
        }
      }

      function stopRecognition() {
        if (!recognition) return;
        isRecording = false;
        try {
          recognition.stop();
        } catch (e) {
          // ignore
        }
        setRecordingState(false);
      }

      startButton.addEventListener("click", startRecognition);
      micButton.addEventListener("click", startRecognition);

      stopButton.addEventListener("click", stopRecognition);

      clearButton.addEventListener("click", function () {
        finalText = "";
        transcriptBox.value = "";
        updateCounter();
        hideError();
      });

      copyButton.addEventListener("click", async function () {
        const text = transcriptBox.value.trim();
        if (!text) {
          showError("There is no text to copy.");
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          copyButton.textContent = "Copied";
          setTimeout(function () {
            copyButton.textContent = "Copy";
          }, 1500);
        } catch (err) {
          transcriptBox.select();
          document.execCommand("copy");
          copyButton.textContent = "Copied";
          setTimeout(function () {
            copyButton.textContent = "Copy";
          }, 1500);
        }
      });

      transcriptBox.addEventListener("input", function () {
        finalText = transcriptBox.value;
        updateCounter();
      });

      updateCounter();

    })();
  </script>

</body>
</html>
