<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

  <title>DEEPBYTO Recognizer</title>

  <!-- favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <meta
    name="description"
    content="DEEPBYTO Recognizer - real-time English speech to text in your browser."
  >

  <style>
    /* ----- reset & base ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 920px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
    }

    /* ----- header / logo ----- */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0 12px 0;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }

    .logo-container {
      flex-shrink: 0;
      line-height: 0;
    }

    .logo-container img {
      display: block;
      width: 52px;
      height: 52px;
      object-fit: contain;
      background: transparent;
      border-radius: 12px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffffff 60%, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 400;
      color: #777777;
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* ----- main card ----- */
    .card {
      flex: 1 1 auto;
      background: #121212;
      border: 1px solid #282828;
      border-radius: 24px;
      padding: 24px 26px 20px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .card-header {
      flex-shrink: 0;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-header-left h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 0;
      color: #ffffff;
    }

    .card-header-left .description {
      color: #888888;
      font-size: 13px;
      margin-top: 2px;
    }

    .badge {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 500;
      color: #999999;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* status */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      background: #0e0e0e;
      border-radius: 14px;
      border: 1px solid #222222;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aaaaaa;
      font-size: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444444;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .status.recording .status-dot {
      background: #ffffff;
      box-shadow: 0 0 16px rgba(255,255,255,0.4);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .status-text {
      font-weight: 500;
    }

    .status-time {
      font-size: 11px;
      color: #666666;
      font-variant-numeric: tabular-nums;
    }

    /* textarea */
    .textarea-wrapper {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 140px;
    }

    textarea {
      width: 100%;
      flex: 1 1 auto;
      resize: none;
      background: #0a0a0a;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 16px 18px;
      color: #f0f0f0;
      font-size: 16px;
      line-height: 1.7;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 110px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #444444;
    }

    textarea::placeholder {
      color: #4a4a4a;
      font-style: italic;
    }

    /* stats row */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: #5a5a5a;
      font-size: 11px;
      flex-shrink: 0;
      padding: 0 4px;
    }

    .stats .lang-badge {
      background: #161616;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid #282828;
      font-size: 10px;
      color: #777777;
    }

    /* controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-shrink: 0;
    }

    .controls-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid #2e2e2e;
      background: #181818;
      color: #e0e0e0;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      line-height: 1;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      font-family: inherit;
    }

    button:hover {
      background: #252525;
      border-color: #3a3a3a;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary:hover {
      background: #e8e8e8;
      border-color: #e8e8e8;
    }

    .btn-danger {
      border-color: #4a2222;
      color: #ff6b6b;
    }

    .btn-danger:hover {
      background: #2a1515;
      border-color: #5a2a2a;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    .mic-button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 22px;
      padding: 0;
      line-height: 1;
      border-color: #333333;
      background: #161616;
      transition: all 0.2s;
    }

    .mic-button:hover {
      background: #222222;
      border-color: #555555;
    }

    .mic-button.recording {
      border-color: #ffffff;
      background: #1a1a1a;
      box-shadow: 0 0 30px rgba(255,255,255,0.08);
    }

    .btn-icon {
      font-size: 14px;
    }

    /* error */
    .error {
      display: none;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid #3a2222;
      background: #1a0e0e;
      border-radius: 12px;
      color: #ff8a8a;
      font-size: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .info {
      margin-top: 12px;
      padding: 10px 14px;
      background: #0e0e0e;
      border: 1px solid #202020;
      border-radius: 12px;
      color: #666666;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
      flex-shrink: 0;
    }

    .info strong {
      color: #888888;
      font-weight: 500;
    }

    /* footer */
    footer {
      text-align: center;
      color: #444444;
      font-size: 11px;
      padding: 12px 0 4px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    footer span {
      color: #555555;
    }

    /* responsive */
    @media (max-width: 700px) {
      .app {
        padding: 10px 12px 8px;
      }

      .card {
        padding: 16px 16px 16px;
        border-radius: 20px;
        margin-top: 12px;
      }

      .card-header-left h1 {
        font-size: 21px;
      }

      .brand-name {
        font-size: 17px;
      }
      .logo-container img {
        width: 42px;
        height: 42px;
      }
      .badge {
        font-size: 10px;
        padding: 4px 12px;
      }
      .status-bar {
        padding: 6px 12px;
        flex-wrap: wrap;
      }
      .status-time {
        font-size: 10px;
      }
      textarea {
        font-size: 15px;
        padding: 12px 14px;
        min-height: 80px;
      }
      .controls {
        gap: 6px;
      }
      .controls-group {
        gap: 6px;
      }
      button {
        padding: 8px 14px;
        font-size: 12px;
        min-height: 38px;
        border-radius: 10px;
      }
      .mic-button {
        width: 46px;
        height: 46px;
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 6px 6px 4px;
      }
      .card {
        padding: 12px 10px 12px;
        border-radius: 16px;
        margin-top: 8px;
      }
      .brand {
        gap: 10px;
        padding: 4px 0 8px;
      }
      .logo-container img {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }
      .brand-name {
        font-size: 15px;
      }
      .brand-sub {
        font-size: 9px;
        letter-spacing: 1px;
      }
      .card-header-left h1 {
        font-size: 18px;
      }
      .card-header-left .description {
        font-size: 11px;
      }
      .badge {
        font-size: 9px;
        padding: 3px 10px;
        margin-top: 2px;
      }
      .status-bar {
        padding: 5px 10px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .status-left {
        font-size: 11px;
        gap: 6px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
      }
      .status-time {
        font-size: 9px;
      }
      textarea {
        font-size: 14px;
        padding: 10px 12px;
        min-height: 60px;
        border-radius: 12px;
      }
      .stats {
        font-size: 10px;
      }
      .controls {
        gap: 4px;
        margin-top: 10px;
      }
      .controls-group {
        gap: 4px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 6px 10px;
        font-size: 11px;
        min-height: 34px;
        border-radius: 8px;
        gap: 4px;
      }
      .mic-button {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }
      .btn-icon {
        font-size: 12px;
      }
      .info {
        font-size: 10px;
        padding: 6px 10px;
        margin-top: 8px;
      }
      .error {
        font-size: 11px;
        padding: 8px 12px;
        margin-top: 8px;
      }
      footer {
        font-size: 9px;
        padding: 8px 0 2px;
      }
    }

    @media (min-height: 900px) {
      .card {
        padding: 28px 32px 24px;
      }
      textarea {
        min-height: 180px;
      }
      .card-header-left h1 {
        font-size: 30px;
      }
    }

    @media (max-height: 700px) {
      .brand {
        padding: 2px 0 6px;
      }
      .logo-container img {
        width: 34px;
        height: 34px;
      }
      .brand-name {
        font-size: 15px;
      }
      .brand-sub {
        font-size: 9px;
      }
      .card {
        padding: 10px 12px 10px;
        margin-top: 6px;
        border-radius: 16px;
      }
      .card-header-left h1 {
        font-size: 18px;
      }
      .card-header-left .description {
        font-size: 11px;
        margin-top: 0;
      }
      .status-bar {
        padding: 4px 10px;
        margin-bottom: 6px;
      }
      .status-left {
        font-size: 10px;
      }
      textarea {
        min-height: 50px;
        font-size: 13px;
        padding: 8px 12px;
      }
      .controls {
        margin-top: 6px;
        gap: 4px;
      }
      button {
        padding: 5px 10px;
        font-size: 10px;
        min-height: 30px;
        border-radius: 8px;
      }
      .mic-button {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }
      .info {
        padding: 4px 8px;
        margin-top: 4px;
        font-size: 9px;
      }
      .stats {
        font-size: 9px;
        margin-top: 4px;
      }
      footer {
        padding: 2px 0;
        font-size: 9px;
      }
      .error {
        padding: 6px 10px;
        margin-top: 4px;
        font-size: 10px;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- header -->
    <header class="brand">
      <div class="logo-container">
        <img src="logo.png" alt="DEEPBYTO Logo" width="52" height="52">
      </div>
      <div class="brand-text">
        <span class="brand-name">DEEPBYTO Recognizer</span>
        <span class="brand-sub">Real‑Time Speech to Text</span>
      </div>
    </header>

    <!-- main card -->
    <div class="card">

      <div class="card-header">
        <div class="card-header-left">
          <h1>Voice to Text</h1>
          <p class="description">Speak naturally — we'll transcribe it instantly.</p>
        </div>
        <span class="badge">🔊 English (US)</span>
      </div>

      <!-- status bar -->
      <div class="status-bar" id="statusBar">
        <div class="status-left">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Ready</span>
        </div>
        <span class="status-time" id="statusTime">●</span>
      </div>

      <!-- textarea -->
      <div class="textarea-wrapper">
        <textarea
          id="transcript"
          placeholder="Your speech will appear here..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- stats -->
      <div class="stats">
        <span class="lang-badge">en-US</span>
        <span id="counter">0 characters</span>
      </div>

      <!-- controls -->
      <div class="controls">
        <div class="controls-group">
          <button
            class="mic-button"
            id="micButton"
            title="Start microphone"
            aria-label="Start microphone"
          >
            🎙
          </button>
        </div>

        <div class="controls-group">
          <button
            class="btn-primary"
            id="startButton"
          >
            ▶ Start
          </button>

          <button
            id="stopButton"
            disabled
            class="btn-danger"
          >
            ■ Stop
          </button>
        </div>

        <div class="controls-group">
          <button
            id="copyButton"
          >
            📋 Copy
          </button>

          <button
            id="clearButton"
          >
            ✕ Clear
          </button>
        </div>
      </div>

      <!-- error -->
      <div class="error" id="error"></div>

      <!-- info -->
      <div class="info">
        <strong>⚡ Real‑time</strong> &nbsp;·&nbsp; Works best in <strong>Chrome</strong> or <strong>Edge</strong> over HTTPS &nbsp;·&nbsp; Microphone access required
      </div>

    </div>

    <footer>
      <span>DEEPBYTO</span> · AI &amp; Software Innovations Lab
    </footer>

  </div>

  <script>
    (function() {
      'use strict';

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const transcriptBox = document.getElementById("transcript");
      const startButton = document.getElementById("startButton");
      const stopButton = document.getElementById("stopButton");
      const micButton = document.getElementById("micButton");
      const copyButton = document.getElementById("copyButton");
      const clearButton = document.getElementById("clearButton");
      const statusBar = document.getElementById("statusBar");
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const statusTime = document.getElementById("statusTime");
      const errorBox = document.getElementById("error");
      const counter = document.getElementById("counter");

      let recognition;
      let isRecording = false;
      let finalText = "";
      let startTime = null;
      let timerInterval = null;

      function updateCounter() {
        const len = transcriptBox.value.length;
        counter.textContent = len + (len === 1 ? ' character' : ' characters');
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      function hideError() {
        errorBox.style.display = "none";
      }

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      }

      function updateTimer() {
        if (startTime) {
          const elapsed = (Date.now() - startTime) / 1000;
          statusTime.textContent = '⏱ ' + formatTime(elapsed);
        }
      }

      function setRecordingState(recording) {
        isRecording = recording;

        if (recording) {
          statusBar.classList.add("recording");
          statusText.textContent = "Listening...";
          startButton.disabled = true;
          stopButton.disabled = false;
          micButton.classList.add("recording");
          startTime = Date.now();
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(updateTimer, 500);
          updateTimer();
        } else {
          statusBar.classList.remove("recording");
          statusText.textContent = "Ready";
          startButton.disabled = false;
          stopButton.disabled = true;
          micButton.classList.remove("recording");
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          startTime = null;
          statusTime.textContent = '●';
        }
      }

      if (!SpeechRecognition) {
        startButton.disabled = true;
        micButton.disabled = true;
        showError(
          "Speech Recognition is not supported in this browser. Please use the latest Google Chrome or Microsoft Edge."
        );
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function () {
          hideError();
          setRecordingState(true);
        };

        recognition.onresult = function (event) {
          let interimText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const text = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalText += text + " ";
            } else {
              interimText += text;
            }
          }

          transcriptBox.value = finalText + interimText;
          updateCounter();
          transcriptBox.scrollTop = transcriptBox.scrollHeight;
        };

        recognition.onerror = function (event) {
          if (event.error === "not-allowed") {
            showError(
              "Microphone permission was denied. Please allow microphone access and try again."
            );
          } else if (event.error === "no-speech") {
            showError(
              "No speech detected. Please speak clearly and try again."
            );
          } else {
            showError(
              "Speech recognition error: " + event.error
            );
          }
          setRecordingState(false);
        };

        recognition.onend = function () {
          if (isRecording) {
            try {
              recognition.start();
            } catch (e) {
              // ignore
            }
          } else {
            setRecordingState(false);
          }
        };
      }

      function startRecognition() {
        if (!recognition) return;
        hideError();
        try {
          recognition.start();
        } catch (e) {
          // ignore
        }
      }

      function stopRecognition() {
        if (!recognition) return;
        isRecording = false;
        try {
          recognition.stop();
        } catch (e) {
          // ignore
        }
        setRecordingState(false);
      }

      startButton.addEventListener("click", startRecognition);
      micButton.addEventListener("click", startRecognition);

      stopButton.addEventListener("click", stopRecognition);

      clearButton.addEventListener("click", function () {
        finalText = "";
        transcriptBox.value = "";
        updateCounter();
        hideError();
      });

      copyButton.addEventListener("click", async function () {
        const text = transcriptBox.value.trim();
        if (!text) {
          showError("There is no text to copy.");
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          const original = copyButton.innerHTML;
          copyButton.innerHTML = '✅ Copied!';
          setTimeout(function () {
            copyButton.innerHTML = original;
          }, 1500);
        } catch (err) {
          transcriptBox.select();
          document.execCommand("copy");
          const original = copyButton.innerHTML;
          copyButton.innerHTML = '✅ Copied!';
          setTimeout(function () {
            copyButton.innerHTML = original;
          }, 1500);
        }
      });

      transcriptBox.addEventListener("input", function () {
        finalText = transcriptBox.value;
        updateCounter();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Ctrl+Enter to start
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          if (!isRecording) startRecognition();
        }
        // Escape to stop
        if (e.key === 'Escape' && isRecording) {
          e.preventDefault();
          stopRecognition();
        }
        // Ctrl+Shift+C to copy
        if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
          e.preventDefault();
          copyButton.click();
        }
      });

      updateCounter();

    })();
  </script>

</body>
</html>
