<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DEEPBYTO Speech Recognition</title>

  <meta
    name="description"
    content="DEEPBYTO Speech Recognition - real-time English speech to text in your browser."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border: 2px solid #ffffff;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 6px;
      color: #888888;
      font-size: 13px;
    }

    .card {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #999999;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
      color: #aaaaaa;
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555555;
    }

    .status.recording .status-dot {
      background: #ffffff;
      box-shadow: 0 0 12px #ffffff;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 18px;
      color: #ffffff;
      font-size: 17px;
      line-height: 1.7;
      outline: none;
    }

    textarea:focus {
      border-color: #555555;
    }

    textarea::placeholder {
      color: #555555;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 1px solid #333333;
      background: #191919;
      color: #ffffff;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      background: #252525;
    }

    .start {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .start:hover {
      background: #dddddd;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mic-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 22px;
      padding: 0;
    }

    .recording {
      border-color: #ffffff;
    }

    .info {
      margin-top: 18px;
      padding: 13px;
      background: #0c0c0c;
      border: 1px solid #222222;
      border-radius: 10px;
      color: #777777;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #444444;
      border-radius: 10px;
      color: #cccccc;
      font-size: 13px;
      text-align: center;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #666666;
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #555555;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .card {
        padding: 20px;
        margin-top: 10px;
      }

      h1 {
        font-size: 27px;
      }

      textarea {
        min-height: 280px;
        font-size: 16px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .mic-button {
        grid-column: 1 / -1;
        margin: 0 auto;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <div class="logo">D</div>
      <div class="brand-name">DEEPBYTO</div>
      <div class="subtitle">Speech Recognition</div>
    </div>

    <div class="card">

      <h1>Speak. Transcribe. Done.</h1>

      <p class="description">
        Convert your English speech into text in real time.
      </p>

      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>

      <textarea
        id="transcript"
        placeholder="Your speech will appear here..."
      ></textarea>

      <div class="stats">
        <span>English — en-US</span>
        <span id="counter">0 characters</span>
      </div>

      <div class="controls">

        <button
          class="mic-button"
          id="micButton"
          title="Start microphone"
        >
          🎙
        </button>

        <button
          class="start"
          id="startButton"
        >
          Start
        </button>

        <button
          id="stopButton"
          disabled
        >
          Stop
        </button>

        <button
          id="copyButton"
        >
          Copy
        </button>

        <button
          id="clearButton"
        >
          Clear
        </button>

      </div>

      <div class="error" id="error"></div>

      <div class="info">
        For best results, use the latest Chrome or Edge over HTTPS.
        Microphone permission is required.
      </div>

    </div>

    <footer>
      DEEPBYTO · AI &amp; Software Innovations Lab
    </footer>

  </div>

  <script>
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    const transcriptBox = document.getElementById("transcript");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const micButton = document.getElementById("micButton");
    const copyButton = document.getElementById("copyButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("error");
    const counter = document.getElementById("counter");

    let recognition;
    let isRecording = false;
    let finalText = "";

    function updateCounter() {
      counter.textContent =
        transcriptBox.value.length + " characters";
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.style.display = "none";
    }

    function setRecordingState(recording) {
      isRecording = recording;

      if (recording) {
        status.classList.add("recording");
        statusText.textContent = "Listening...";
        startButton.disabled = true;
        stopButton.disabled = false;
        micButton.classList.add("recording");
      } else {
        status.classList.remove("recording");
        statusText.textContent = "Ready";
        startButton.disabled = false;
        stopButton.disabled = true;
        micButton.classList.remove("recording");
      }
    }

    if (!SpeechRecognition) {

      startButton.disabled = true;
      micButton.disabled = true;

      showError(
        "Speech Recognition is not supported in this browser. Please use the latest Google Chrome or Microsoft Edge."
      );

    } else {

      recognition = new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function () {
        hideError();
        setRecordingState(true);
      };

      recognition.onresult = function (event) {

        let interimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const text =
            event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            finalText += text + " ";
          } else {
            interimText += text;
          }

        }

        transcriptBox.value =
          finalText + interimText;

        updateCounter();

        transcriptBox.scrollTop =
          transcriptBox.scrollHeight;
      };

      recognition.onerror = function (event) {

        if (event.error === "not-allowed") {
          showError(
            "Microphone permission was denied. Please allow microphone access and try again."
          );
        } else if (event.error === "no-speech") {
          showError(
            "No speech detected. Please speak clearly and try again."
          );
        } else {
          showError(
            "Speech recognition error: " + event.error
          );
        }

        setRecordingState(false);
      };

      recognition.onend = function () {

        if (isRecording) {
          try {
            recognition.start();
          } catch (error) {}
        } else {
          setRecordingState(false);
        }

      };

    }

    function startRecognition() {

      if (!recognition) return;

      hideError();

      try {
        recognition.start();
      } catch (error) {}

    }

    function stopRecognition() {

      if (!recognition) return;

      isRecording = false;

      try {
        recognition.stop();
      } catch (error) {}

      setRecordingState(false);
    }

    startButton.addEventListener(
      "click",
      startRecognition
    );

    micButton.addEventListener(
      "click",
      startRecognition
    );

    stopButton.addEventListener(
      "click",
      stopRecognition
    );

    clearButton.addEventListener(
      "click",
      function () {

        finalText = "";
        transcriptBox.value = "";
        updateCounter();
        hideError();

      }
    );

    copyButton.addEventListener(
      "click",
      async function () {

        const text = transcriptBox.value.trim();

        if (!text) {
          showError("There is no text to copy.");
          return;
        }

        try {

          await navigator.clipboard.writeText(text);

          copyButton.textContent = "Copied";

          setTimeout(function () {
            copyButton.textContent = "Copy";
          }, 1500);

        } catch (error) {

          transcriptBox.select();
          document.execCommand("copy");

          copyButton.textContent = "Copied";

          setTimeout(function () {
            copyButton.textContent = "Copy";
          }, 1500);

        }

      }
    );

    transcriptBox.addEventListener(
      "input",
      function () {

        finalText = transcriptBox.value;
        updateCounter();

      }
    );

    updateCounter();
  </script>

</body>
</html>
